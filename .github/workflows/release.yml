name: release

# Tagging is the whole release: `git tag v0.1.0 && git push --tags` builds
# every platform and publishes them. Running it by hand builds the same
# tarballs and keeps them as run artifacts without publishing anything.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Each arch is built on its own arch where there is a runner for
          # it, so the tests can actually run against the binary that ships.
          - os: macos-latest
            target: aarch64-apple-darwin
            native: true
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            native: true
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            native: true

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal

      # Needed before anything builds or tests for a target that is not the
      # runner's own.
      - name: Add the target
        run: rustup target add ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # Rust links musl self-contained, but the toolchain is cheap insurance.
      - name: Install musl tools
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends musl-tools

      # Nothing ships untested. Skipped where the runner cannot run what it
      # just built, which is only the x86 mac build.
      - name: Test
        if: matrix.native
        run: cargo test --release --locked --target ${{ matrix.target }}

      - name: Package
        run: ./scripts/dist.sh ${{ matrix.target }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Check the tag matches Cargo.toml
        run: |
          crate=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          if [ "v$crate" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match Cargo.toml version $crate" >&2
            exit 1
          fi
          ls -l dist

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag

  # Updates the Homebrew tap, if there is a token for it. Without one this
  # says so and succeeds, so a release never fails for want of a secret.
  tap:
    needs: publish
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v7

      - name: Update the Homebrew formula
        env:
          GH_TOKEN: ${{ github.token }}
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAP: ${{ vars.HOMEBREW_TAP || 'nimishgj/homebrew-tap' }}
        run: |
          if [ -z "${TAP_TOKEN:-}" ]; then
            echo "No HOMEBREW_TAP_TOKEN secret set; skipping the tap update."
            echo "See docs/releasing.md to set it up."
            exit 0
          fi
          version="${GITHUB_REF_NAME#v}"

          # The formula quotes the checksums the release actually published.
          gh release download "$GITHUB_REF_NAME" --pattern '*.sha256' -D dist
          ./scripts/brew-formula.sh "$version" > formula.rb

          git clone --depth 1 "https://x-access-token:$TAP_TOKEN@github.com/$TAP" tap
          mkdir -p tap/Formula
          cp formula.rb tap/Formula/k9mux.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/k9mux.rb
          if git diff --cached --quiet; then
            echo "The formula is already up to date."
            exit 0
          fi
          git commit -m "k9mux $version"
          git push
