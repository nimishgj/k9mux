[package]
name = "k9mux"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[dependencies]
anyhow = "1.0.104"
crossterm = "0.29.0"
portable-pty = "0.9.0"
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde-saphyr = "1.2.0"
toml = "1.1.6"
tui-term = "0.3.4"
vt100 = "0.16.2"

[dev-dependencies]
serde_json = "1.0.151"
tempfile = "3.27.0"

[profile.release]
# The binary is what ships, so trade build time for size and speed.
strip = true
lto = "thin"
